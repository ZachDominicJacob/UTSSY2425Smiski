<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakers & Brewers - Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="stylesboot.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-brand-border bg-white">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="transparentlogo.png" height="60px">
    </a>
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">Location</a></li>
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm" href="checkout.html">
            Cart <span id="nav-cart-count" class="badge bg-dark text-white ms-1">0</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h2 class="font-heading text-center mb-5">Your Shopping Cart</h2>

  <div class="row g-5">
    
    <div class="col-lg-8">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <div id="cart-items-container">
            <p class="text-center text-muted">Your cart is empty.</p>
          </div>
        </div>
      </div>
      <div class="text-end mt-3">
        <button onclick="clearCart()" class="checkout-button">Clear Cart</button>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h4 class="font-heading mb-4">Order Summary</h4>
          
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span class="fw-bold">₱ <span id="summary-subtotal">0.00</span></span>
          </div>
          <div class="d-flex justify-content-between mb-4">
            <span>Service Fee</span>
            <span>₱ 0.00</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <span class="fs-4 fw-bold font-heading">Total</span>
            <span class="fs-4 fw-bold text-success">₱ <span id="summary-total">0.00</span></span>
          </div>

          <form id="checkout-form" onsubmit="placeOrder(event)">
            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input type="text" id="customer-name" class="form-control" required placeholder="John Doe">
            </div>
            
            <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold">
              PLACE ORDER
            </button>
          </form>

        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    loadCart();
    updateNavCartCount();
  });

  function loadCart() {
    const cart = JSON.parse(localStorage.getItem('bb_cart')) || [];
    const container = document.getElementById('cart-items-container');
    const subtotalEl = document.getElementById('summary-subtotal');
    const totalEl = document.getElementById('summary-total');

    if (cart.length === 0) {
      container.innerHTML = '<div class="text-center py-5"><h4>Your cart is empty 😔</h4><a href="menu.html" class="btn btn-warning mt-3">Go to Menu</a></div>';
      subtotalEl.innerText = "0.00";
      totalEl.innerText = "0.00";
      return;
    }

    let html = '';
    let total = 0;

    cart.forEach((item, index) => {
      total += item.totalCost;
      
      // Use class 'cart-thumb-img' here
      html += `
        <div class="d-flex align-items-center mb-4 border-bottom pb-3">
          <img src="menu/${item.image}.jpg" 
               class="rounded me-5 cart-thumb-img" 
               onerror="this.onerror=null; this.src='https://placehold.co/100?text=IMG'">
          
          <div class="flex-grow-1">
            <h5 class="mb-1 font-heading">${item.name}</h5>
            <p class="mb-0 text-muted small">
              ${item.size} • ${item.temp}
            </p>
            <p class="mb-0 fw-bold">₱ ${item.price.toFixed(2)} x ${item.quantity}</p>
          </div>

          <div class="text-end">
            <span class="fs-5 fw-bold text-dark">₱ ${item.totalCost.toFixed(2)}</span>
            <br>
            <button class="btn btn-link text-danger text-decoration-none p-0 small" onclick="removeItem(${index})">Remove</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
    subtotalEl.innerText = total.toFixed(2);
    totalEl.innerText = total.toFixed(2);
  }

  function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem('bb_cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('bb_cart', JSON.stringify(cart));
    loadCart();
    updateNavCartCount();
  }

  function clearCart() {
    localStorage.removeItem('bb_cart');
    loadCart();
    updateNavCartCount();
  }

  async function placeOrder(e) {
    e.preventDefault();

    const cart = JSON.parse(localStorage.getItem('bb_cart')) || [];
    if (cart.length === 0) {
      alert("Cart is empty!");
      return;
    }

    const customerName = document.getElementById('customer-name').value;
    const totalAmount = document.getElementById('summary-total').innerText;

    const orderData = {
      customer: customerName,
      items: cart,
      total: totalAmount
    };

    try {
      const response = await fetch('http://localhost:4000/api/place-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });

      if (response.ok) {
        alert(`✅ Success! Thank you ${customerName}, your order has been received.`);
        localStorage.removeItem('bb_cart');
        window.location.href = 'index.html';
      } else {
        alert("Server Error: Could not place order.");
      }
    } catch (err) {
      console.error(err);
      alert("Network Error. Is the server running?");
    }
  }

  function updateNavCartCount() {
    const cart = JSON.parse(localStorage.getItem('bb_cart')) || [];
    const badge = document.getElementById('nav-cart-count');
    if(badge) badge.innerText = cart.length;
  }
</script>
</body>
</html>
